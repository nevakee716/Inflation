name: discover-insee (temporary)
on:
  push:
    branches: [claude/project-thread-6efbtj]
jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - run: |
          B=https://bdm.insee.fr/series/sdmx
          C="curl -sS --compressed --max-time 180 --retry 3"
          $C "$B/datastructure/FR1/IPC-2025?references=children" -o dsd.xml
          python3 - <<'PY'
          import re
          x=open('dsd.xml',encoding='utf-8').read()
          for cl in re.finditer(r'<str:Codelist [^>]*id="([^"]+)"[^>]*>(.*?)</str:Codelist>', x, re.S):
              if cl.group(1) not in ('CL_NATURE','CL_COICOP2018','CL_BASIND'): continue
              codes=re.findall(r'<str:Code [^>]*id="([^"]+)"[^>]*>\s*<com:Name xml:lang="fr">([^<]*)', cl.group(2))
              print("CL", cl.group(1), len(codes))
              for c in codes[:70]: print("   ", c[0], "|", c[1][:70])
          PY
          summarize() { python3 -c '
          import re,sys
          x=open(sys.argv[1],encoding="utf-8").read()
          for m in re.finditer(r"<Series ([^>]*)>(.*?)</Series>", x, re.S):
              a=dict(re.findall(r"(\w[\w-]*)=\"([^\"]*)\"", m.group(1)))
              obs=re.findall(r"TIME_PERIOD=\"([^\"]+)\"[^>]*OBS_VALUE=\"([^\"]*)\"", m.group(2))
              print(a.get("IDBANK"), {k:a.get(k) for k in ("COICOP2018","COICOP2016","NATURE","FREQ","BASIND")}, obs[:2], a.get("TITLE_FR","")[-60:])
          ' "$1"; }
          echo "=== 2025 indices first obs"
          $C "$B/data/IPC-2025/M.IPC.SO..SO.INDICE.ENSEMBLE.FE.SO.BRUT.2025.FALSE?firstNObservations=1" -o a.xml; wc -c a.xml; summarize a.xml | head -80; summarize a.xml | wc -l
          echo "=== 2025 any nature with POND"
          $C "$B/data/IPC-2025/.IPC.SO.01....FE....?lastNObservations=1" -o p.xml; wc -c p.xml; summarize p.xml | grep -iv 'INDICE\|GLISSEMENT\|VARIATIONS' | head -30
          echo "=== 2015 ensemble"
          $C "$B/data/IPC-2015/M.IPC.SO.00.SO.INDICE.ENSEMBLE.FE.SO.BRUT.2015.?firstNObservations=1" -o e.xml; wc -c e.xml; summarize e.xml
          $C "$B/data/SERIES_BDM/001759970?lastNObservations=1" -o f.xml; summarize f.xml
